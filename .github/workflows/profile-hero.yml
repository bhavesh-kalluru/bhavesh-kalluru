name: Build animated profile artwork

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/hero.svg'
      - 'assets/render_hero.py'
      - '.github/workflows/profile-hero.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow cairosvg
      - run: python assets/render_hero.py
      - name: Commit updated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero.gif
          if ! git diff --cached --quiet; then
            git commit -m "feat: render animated GitHub profile hero"
            git push
          fi

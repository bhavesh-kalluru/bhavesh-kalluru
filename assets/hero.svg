<g font-size="11" font-weight="700" text-anchor="middle"><text x="132" y="342" fill="#99E4FF">RAG SYSTEMS</text><text x="258" y="342" fill="#C3B3FF">AI AGENTS</text><text x="396" y="342" fill="#90F5DF">MLOPS / APIs</text></g>
<text x="78" y="395" class="small" style="fill:#91A3C5">RETRIEVE · REASON · EVALUATE · SHIP</text><text x="1122" y="395" text-anchor="end" class="small" style="font-size:10px;fill:#91A3C5">01 / INFINITE BUILDS</text>
